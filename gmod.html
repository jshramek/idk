<!DOCTYPE html>
<html>
<head>
    <title>GMod Server Loading...</title>
    <style>
        body {
            background-color: #000000;
            color: #ffaa00; /* Neon Orange Donut */
            font-family: monospace;
            font-size: 11px;
            line-height: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #server-name {
            font-size: 24px;
            margin-bottom: 20px;
            font-family: 'Arial', sans-serif;
            font-weight: bold;
        }
        pre {
            background: transparent;
        }
    </style>
</head>
<body>

    <div id="server-name">CONNECTING TO SERVER...</div>
    <pre id="donut"></pre>

    <script>
        // Andy Sloane's Donut Mathematical Animation Code
        const donutContainer = document.getElementById('donut');
        let A = 0, B = 0;

        function renderFrame() {
            let b = [];
            let z = [];
            A += 0.07;
            B += 0.03;
            let cA = Math.cos(A), sA = Math.sin(A),
                cB = Math.cos(B), sB = Math.sin(B);
            
            for (let k = 0; k < 1760; k++) {
                b[k] = k % 80 == 79 ? "\n" : " ";
                z[k] = 0;
            }
            
            for (let j = 0; j < 6.28; j += 0.07) {
                let ct = Math.cos(j), st = Math.sin(j);
                for (let i = 0; i < 6.28; i += 0.02) {
                    let sp = Math.sin(i), cp = Math.cos(i),
                        h = ct + 2,
                        D = 1 / (sp * h * sA + st * cA + 5),
                        t = sp * h * cA - st * sA;

                    let x = Math.floor(40 + 30 * D * (cp * h * cB - t * sB)),
                        y = Math.floor(12 + 15 * D * (cp * h * sB + t * cB)),
                        o = x + 80 * y,
                        N = Math.floor(8 * ((st * sA - sp * ct * cA) * cB - sp * ct * sA - st * cA - cp * ct * sB));

                    if (y < 22 && y >= 0 && x >= 0 && x < 79 && D > z[o]) {
                        z[o] = D;
                        b[o] = ".,-~:;=!*#$@"[N > 0 ? N : 0];
                    }
                }
            }
            donutContainer.textContent = b.join("");
            requestAnimationFrame(renderFrame);
        }
        renderFrame();

        // GMod Engine Integration Hooks
        function GameDetails(serverName, serverURL, mapName, maxPlayers, steamID, gamemode) {
            document.getElementById('server-name').innerText = serverName.toUpperCase();
        }
    </script>
</body>
</html>
